<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Argos | Processos e CPU</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <link rel="stylesheet" href="./css/dash_cpu.css">
</head>
<body>

    <div class="modal-dash-ransomware">
        <div class="modal">

            <div class="top">
                <div class="titulo">
                    <h2><i class="fas fa-microchip"></i> Processos e CPU</h2>
                </div>
                <div class="top-right">
                    <div class="atualizacao">
                        <span>
                            <i class="fas fa-sync-alt"></i> Última atualização: <span id="updateTime">--:--</span>
                        </span>
                    </div>
                </div>
            </div>

            <div class="server-badge">
                <span><i class="fas fa-server"></i> Servidor 3 · Produção</span>
            </div>

            <div class="box">
                <div class="kpis">
                    <div class="kpi">
                        <div class="kpi-top">
                            <div class="kpi-icon"><i class="fas fa-microchip"></i></div>
                            <div class="kpi-info">
                                <h4>Uso de CPU</h4>
                                <h2 id="kpiCpu">--%</h2>
                            </div>
                        </div>
                        <div class="kpi-detalhes">
                            <div class="pico">
                                Pico (30min)
                                <span id="picoCpu">--</span>
                            </div>
                            <div class="media">
                                Média (3h)
                                <span id="media3hCpu">--</span>
                            </div>
                        </div>
                    </div>

                    <div class="kpi">
                        <div class="kpi-top">
                            <div class="kpi-icon"><i class="fas fa-exchange-alt"></i></div>
                            <div class="kpi-info">
                                <h4>Trocas de Contexto</h4>
                                <h2 id="kpiCs">--k</h2>
                            </div>
                        </div>
                        <div class="kpi-detalhes">
                            <div class="pico">
                                Pico (30min)
                                <span id="picoCs">--</span>
                            </div>
                            <div class="media">
                                Média (3h)
                                <span id="media3hCs">--</span>
                            </div>
                        </div>
                    </div>

                    <div class="kpi">
                        <div class="kpi-top">
                            <div class="kpi-icon"><i class="fas fa-tasks"></i></div>
                            <div class="kpi-info">
                                <h4>Processos Ativos</h4>
                                <h2 id="kpiProcessos">--</h2>
                            </div>
                        </div>
                        <div class="kpi-detalhes">
                            <div class="pico">
                                Pico (30min)
                                <span id="picoProcessos">--</span>
                            </div>
                            <div class="media">
                                Média (3h)
                                <span id="media3hProcessos">--</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="graficos">
                <div class="card-componente"><div class="card-grafico"><canvas id="cpuChart"></canvas></div></div>
                <div class="card-componente"><div class="card-grafico"><canvas id="csChart"></canvas></div></div>
                <div class="card-componente"><div class="card-grafico"><canvas id="topProcessChart"></canvas></div></div>
                <div class="card-componente"><div class="card-grafico"><canvas id="totalProcChart"></canvas></div></div>
            </div>

            <div class="secao-inferior">
                <div class="secao-painel bloco-processos">
                    <h3 class="titulo-secao"><i class="fas fa-ranking-star"></i> TOP 3 - Processos por uso de CPU</h3>
                    <div class="tabela-processos">
                        <div class="tabela-header">
                            <span class="col-pid">PID</span>
                            <span class="col-proc">PROCESSO</span>
                            <span class="col-escrita">Uso de CPU (%)</span>
                        </div>
                        <div class="tabela-body" id="tabelaTopBody"></div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const labels = ['10:25', '10:30', '10:35', '10:40', '10:45', '10:50', '10:55', '11:00', '11:05', '11:10', '11:15', '11:20'];
        const cpuData = [45, 52, 48, 82, 76, 68, 72, 88, 92, 85, 79, 67];
        const csData = [180, 210, 195, 312, 298, 275, 310, 405, 380, 350, 330, 312];
        const topProcessoCPUData = [78, 81, 79, 90, 88, 85, 87, 95, 98, 92, 89, 85];
        const totalProcessosData = [180, 195, 210, 230, 245, 250, 255, 260, 265, 258, 250, 245];

        const topProcessos = [
            { pid: 80, nome: 'python', uso: 92 },
            { pid: 54, nome: 'chrome', uso: 65 },
            { pid: 23, nome: 'InstallService', uso: 38 }
        ];
        const media3hCpu = 55;      
        const media3hCs = 250;      
        const media3hProcessos = 210; 

        function criarGraficoLinha(ctx, label, data, borderColor, yLabel = '') {
            return new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: label,
                        data: data,
                        borderColor: borderColor,
                        backgroundColor: `rgba(${parseInt(borderColor.slice(1,3),16)}, ${parseInt(borderColor.slice(3,5),16)}, ${parseInt(borderColor.slice(5,7),16)}, 0.15)`,
                        tension: 0.2,
                        fill: true,
                        pointRadius: 3,
                        pointBackgroundColor: borderColor,
                        pointBorderColor: '#fff',
                        pointBorderWidth: 1,
                        borderWidth: 2.5
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { labels: { color: '#ddd', font: { size: 11 } } },
                        tooltip: { mode: 'index', intersect: false }
                    },
                    scales: {
                        y: {
                            grid: { color: 'rgba(255,255,255,0.08)' },
                            title: { display: true, text: yLabel, color: '#aaa', font: { size: 10 } },
                            ticks: { color: '#ccc' }
                        },
                        x: {
                            grid: { display: false },
                            ticks: { color: '#ccc', maxRotation: 45, autoSkip: true, maxTicksLimit: 6 }
                        }
                    }
                }
            });
        }

        function getClasseCPU(valor) {
            if (valor <= 40) return 'uso-verde';
            if (valor <= 70) return 'uso-amarelo';
            if (valor <= 90) return 'uso-laranja';
            return 'uso-vermelho';
        }

        function getClasseCS(valor) {
            if (valor <= 150) return 'uso-verde';
            if (valor <= 300) return 'uso-amarelo';
            if (valor <= 500) return 'uso-laranja';
            return 'uso-vermelho';
        }

        function getUsoClasse(uso) {
            return getClasseCPU(uso);
        }

        function inicializarDashboard() {
            const ctx1 = document.getElementById('cpuChart').getContext('2d');
            criarGraficoLinha(ctx1, 'Uso CPU (%)', cpuData, '#f5a623', 'Percentual (%)');
            const ctx2 = document.getElementById('csChart').getContext('2d');
            criarGraficoLinha(ctx2, 'Context Switches (k)', csData, '#3ed64b', 'milhares');
            const ctx3 = document.getElementById('topProcessChart').getContext('2d');
            criarGraficoLinha(ctx3, 'Processo mais pesado (%)', topProcessoCPUData, '#ff8c5a', 'Uso CPU (%)');
            const ctx4 = document.getElementById('totalProcChart').getContext('2d');
            criarGraficoLinha(ctx4, 'Total de processos ativos', totalProcessosData, '#7ab8f5', 'Quantidade');

            const ultimos30minCpu = cpuData.slice(-6);
            const ultimos30minCs = csData.slice(-6);
            const ultimos30minProcessos = totalProcessosData.slice(-6);

            const picoCpu = Math.max(...ultimos30minCpu);
            const picoCs = Math.max(...ultimos30minCs);
            const picoProcessos = Math.max(...ultimos30minProcessos);

            const atualCpu = cpuData[cpuData.length - 1];
            const atualCs = csData[csData.length - 1];
            const atualProcessos = totalProcessosData[totalProcessosData.length - 1];

            document.getElementById('kpiCpu').textContent = atualCpu + '%';
            document.getElementById('kpiCs').textContent = atualCs + 'k';
            document.getElementById('kpiProcessos').textContent = atualProcessos;

            document.getElementById('picoCpu').textContent = picoCpu + '%';
            document.getElementById('media3hCpu').textContent = media3hCpu + '%';

            document.getElementById('picoCs').textContent = picoCs + 'k';
            document.getElementById('media3hCs').textContent = media3hCs + 'k';

            document.getElementById('picoProcessos').textContent = picoProcessos;
            document.getElementById('media3hProcessos').textContent = media3hProcessos;

            const h2Cpu = document.getElementById('kpiCpu');
            h2Cpu.className = '';
            h2Cpu.classList.add(getClasseCPU(atualCpu));

            const h2Cs = document.getElementById('kpiCs');
            h2Cs.className = '';
            h2Cs.classList.add(getClasseCS(atualCs));

            const tabelaBody = document.getElementById('tabelaTopBody');
            tabelaBody.innerHTML = '';
            topProcessos.forEach(p => {
                const uso = p.uso;
                const classeCor = getUsoClasse(uso);
                const row = document.createElement('div');
                row.className = 'tabela-row';
                row.innerHTML = `
                    <span class="col-pid">${p.pid}</span>
                    <span class="col-proc">${p.nome}</span>
                    <span class="col-escrita ${classeCor}">${uso}%</span>
                `;
                tabelaBody.appendChild(row);
            });
            
            function atualizarTimestamp() {
                const now = new Date();
                const formatted = `${now.getDate()+1}/${now.getMonth()}/${now.getFullYear()} ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
                document.getElementById('updateTime').textContent = formatted;
            }
            atualizarTimestamp();
            setInterval(atualizarTimestamp, 30000);
        }

        window.onload = inicializarDashboard;
    </script>

</body>
</html>
